<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Canvas Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      overflow: hidden;
      background-color: #000;
    }
    
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    
    #gameCanvas {
      display: block;
      background-color: #f0f0f0;
      width: 100%;
      height: 100%;
    }
    
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      font-weight: bold;
      color: #333;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 10px;
      display: none;
      z-index: 10;
    }
    
    #gameTitle {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #333;
      font-size: 24px;
      font-weight: bold;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 10px 15px;
      border-radius: 8px;
      z-index: 5;
    }
    
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #333;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 15px;
      border-radius: 8px;
      z-index: 5;
    }
    
    #instructions p {
      margin: 5px 0;
      font-size: 14px;
    }
    
    #playerInfo {
      font-weight: bold;
      color: #0066cc;
    }
    
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="message"></div>
    <div id="gameTitle">Multiplayer Canvas Game</div>
    <div id="instructions">
      <p>Use arrow keys to move your player</p>
      <p id="playerInfo">Connecting to server...</p>
    </div>
  </div>
  
  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
